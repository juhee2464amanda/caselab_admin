<style>
  :root {
    --bg: #0E1118;
    --ivory: #E9E4D6;
    --ivory-2: #B9B4A6;
    --ink-2: #8A8DA0;
    --gold: #C9A96A;
    --gold-soft: rgba(201,169,106,.35);
    --line: rgba(233,228,214,.12);
    --glass: rgba(14,17,24,.9);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:'Noto Sans KR', sans-serif; color:var(--ivory); }

  #stage { position:absolute; inset:0; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #stars { position:absolute; inset:0; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:var(--ivory); }

  #world { position:absolute; left:50%; top:50%; transform-origin:0 0; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  #world.no-anim { transition:none; }

  #topbar {
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; gap:16px; padding:14px 20px; pointer-events:none;
  }
  #topbar > * { pointer-events:auto; }
  #brand { font-family:Marcellus, serif; letter-spacing:.35em; font-size:14px; color:var(--ivory); text-transform:uppercase; }
  #brand em { color:var(--gold); font-style:normal; }
  #search {
    flex:0 0 220px; background:rgba(233,228,214,.06); border:1px solid var(--line);
    border-radius:20px; padding:8px 14px; color:var(--ivory); font-size:12px; outline:none;
  }
  #search::placeholder { color:var(--ink-2); }
  #tagline { margin-left:auto; font-size:11px; letter-spacing:.18em; color:var(--ink-2); text-transform:uppercase; }
  #tagline b { color:var(--gold); font-weight:500; }

  .dept-label { position:absolute; text-align:center; transform:translate(-50%,-50%); pointer-events:none; }
  .dept-label h2 { font-family:Marcellus, 'Noto Serif KR', serif; font-weight:400; font-size:30px; letter-spacing:.3em; color:var(--ivory); white-space:nowrap; }
  .dept-label p { font-size:11px; letter-spacing:.22em; color:var(--ink-2); margin-top:6px; white-space:nowrap; }

  .hub {
    position:absolute; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:50%;
    border:1px solid var(--c, var(--gold)); background:rgba(14,17,24,.7);
    display:flex; align-items:center; justify-content:center; z-index:5;
    box-shadow:0 0 0 6px rgba(233,228,214,.03);
  }
  .hub svg { width:22px; height:22px; stroke:var(--c, var(--gold)); fill:none; stroke-width:1.6; }

  .leaf {
    position:absolute; transform:translate(-50%,-50%); width:13px; height:13px; border-radius:50%;
    background:var(--ivory); border:2px solid var(--bg); cursor:pointer; z-index:4;
    transition:transform .18s, box-shadow .18s, opacity .3s;
  }
  .leaf:hover, .leaf.active { transform:translate(-50%,-50%) scale(1.6); box-shadow:0 0 14px var(--gold-soft); background:var(--gold); }
  .leaf.related { background:var(--gold); box-shadow:0 0 10px var(--gold-soft); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 20px var(--gold); } }
  .leaf .lbl { position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ivory-2); white-space:nowrap; pointer-events:none; }
  .leaf.ll .lbl { left:auto; right:18px; text-align:right; }
  .leaf.t-prompt { border-radius:3px; }
  .leaf.t-tool { background:#8FA98F; }
  .leaf.t-case, .leaf.t-trend { background:var(--gold); }
  .leaf.dim { opacity:.1; pointer-events:none; }

  #core { position:absolute; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  #core .ring { width:120px; height:120px; border-radius:50%; border:1px solid var(--gold-soft); margin:0 auto;
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 60px rgba(201,169,106,.12) inset; }
  #core .ring span { font-family:Marcellus, serif; font-size:13px; letter-spacing:.3em; color:var(--gold); }
  #core p { margin-top:10px; font-size:10px; letter-spacing:.28em; color:var(--ink-2); }

  #panel {
    position:fixed; left:20px; top:70px; z-index:50; width:340px; max-height:calc(100vh - 100px);
    background:var(--glass); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(14px); padding:22px; overflow-y:auto;
    transform:translateX(-120%); transition:transform .35s cubic-bezier(.22,1,.36,1);

  #panel.open { transform:translateX(0); }
  #panel .type-badge { font-size:10px; letter-spacing:.28em; color:var(--gold); text-transform:uppercase; }
  #panel h3 { font-family:'Noto Serif KR', serif; font-size:22px; font-weight:600; margin:8px 0 4px; line-height:1.35; }
  #panel .crumb { font-size:11px; color:var(--ink-2); margin-bottom:14px; }
  #panel .pain { font-size:13px; line-height:1.65; color:var(--ivory-2); margin-bottom:14px; border-left:2px solid var(--gold); padding-left:12px; }
  #panel .excerpt {
    background:rgba(233,228,214,.05); border:1px solid var(--line); border-radius:10px;
    padding:14px; font-size:12px; line-height:1.7; color:var(--ivory-2); margin-bottom:16px;
  }
  #panel .excerpt .cap { display:block; font-size:10px; letter-spacing:.2em; color:var(--ink-2); margin-bottom:8px; text-transform:uppercase; }
  #panel .rels { margin-bottom:16px; }
  #panel .rels .cap { display:block; font-size:10px; letter-spacing:.2em; color:var(--ink-2); margin-bottom:8px; text-transform:uppercase; }
  #panel .rel-chip {
    display:inline-block; margin:0 6px 6px 0; padding:6px 11px; border-radius:16px;
    border:1px solid var(--gold-soft); color:var(--gold); font-size:11px; cursor:pointer;
    background:rgba(201,169,106,.06); transition:background .2s;
  }
  #panel .rel-chip:hover { background:rgba(201,169,106,.18); }
  #panel .cta {
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--gold); color:#181a24; border-radius:10px; padding:12px;
    font-size:13px; font-weight:700; text-decoration:none;
  }
  #panel .cta:hover { filter:brightness(1.08); }
  #panel .close { position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line); background:none; color:var(--ivory-2); cursor:pointer; font-size:13px; }

  #hint { position:fixed; bottom:18px; left:0; right:0; text-align:center; font-size:10px;
    letter-spacing:.3em; color:var(--ink-2); text-transform:uppercase; pointer-events:none; z-index:30; }

  svg.wires { position:absolute; overflow:visible; pointer-events:none; left:0; top:0; width:1px; height:1px; }
  svg.wires line.tree { stroke:rgba(233,228,214,.16); stroke-width:1; }
  svg.wires line.spine { stroke:rgba(201,169,106,.35); stroke-width:1; }
  svg.wires path.rel { stroke:rgba(201,169,106,.10); stroke-width:1; fill:none; stroke-dasharray:3 5; transition:stroke .3s; }
  svg.wires path.rel.on { stroke:rgba(201,169,106,.75); stroke-width:1.4; filter:drop-shadow(0 0 4px rgba(201,169,106,.5)); }

      excerpt:'분류·RAG·요약·도구 사용·멀티모달·프롬프트 캐싱까지 실제로 동작하는 노트북·레시피 모음.',
      rel:['anthropic-prompt-engineering','openai-cookbook'] },
    { slug:'dair-ai-prompt-engineering-guide', title:'Prompt Engineering Guide (76k★)', type:'guide',
      pain:'흩어진 프롬프팅 지식을 한 곳에서 보고 싶음',
      excerpt:'프롬프팅·컨텍스트 엔지니어링·RAG·AI 에이전트까지 다루는 76k stars 종합 가이드. 13개 언어 번역.',
      rel:['prompts-chat','anthropic-prompt-engineering'] },
    { slug:'openai-customer-stories', title:'OpenAI Customer Stories', type:'guide',
      pain:'남들은 실무에 어떻게 쓰는지 궁금함',
      excerpt:'실제 운영 환경에서 GPT를 적용한 회사 사례 모음. 마케팅·세일즈·운영 자동화 적용 패턴.',
      rel:['seam-1000-voc-4d70f072','stanford-ai-index'] },
    { slug:'stanford-ai-index', title:'Stanford AI Index', type:'guide',
      pain:'AI 뉴스는 많은데 큰 그림이 없음',
      excerpt:'스탠퍼드 HAI의 연례 데이터 리포트. 투자·인력·모델 성능·정책까지, 가장 인용되는 공식 리포트.',
      rel:['anthropic-7-24-claude-opus-5-max-pro-f830661e'] },
  ]},
];
const ICONS = {
  prompt:'<path d="M4 17l6-6-6-6M12 19h8"/>',
  tool:'<path d="M14.7 6.3a4 4 0 105.4 5.4L22 14l-6 6-2.3-1.9a4 4 0 10-5.4-5.4L2 8l6-6 2.3 1.9"/>',
  case:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  docs:'<path d="M2 4h7a4 4 0 014 4v12a3 3 0 00-3-3H2zM22 4h-7a4 4 0 00-4 4v12a3 3 0 013-3h8z"/>',
  course:'<path d="M22 10L12 5 2 10l10 5 10-5zM6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>',
  deep:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/>',
};

/* ═══ 씬 구성 ═══ */
const world = document.getElementById('world');
const R_HUB = 380, R_LEAF = 190;
const treeWires = [];
const nodeBySlug = {}, posBySlug = {}, leafBySlug = {}, deptBySlug = {};

function el(tag, cls, css) { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, css||{}); return e; }
const rad = d => d * Math.PI / 180;

const core = el('div'); core.id = 'core'; core.style.left = '0px'; core.style.top = '0px';
core.innerHTML = '<div class="ring"><span>CASELAB</span></div><p>배워가는 지도</p>';
world.appendChild(core);

DATA.forEach(dept => {
  const hx = Math.cos(rad(dept.angle)) * R_HUB;
  const hy = Math.sin(rad(dept.angle)) * R_HUB;
  treeWires.push({ x1:Math.cos(rad(dept.angle))*80, y1:Math.sin(rad(dept.angle))*80, x2:hx, y2:hy, spine:true });

  const hub = el('div', 'hub', { left:hx+'px', top:hy+'px' });
  hub.style.setProperty('--c', dept.color);
  hub.innerHTML = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[dept.key]}</svg>`;
  world.appendChild(hub);

  const lblDist = R_HUB + R_LEAF + 245;
  const lbl = el('div', 'dept-label', { left:Math.cos(rad(dept.angle))*lblDist+'px', top:Math.sin(rad(dept.angle))*lblDist+'px' });
  lbl.innerHTML = `<h2>${dept.label}</h2><p>${dept.sub}</p>`;
  world.appendChild(lbl);

  const n = dept.nodes.length;
  const fan = Math.min(124, 34 * (n - 1) + 18);
  dept.nodes.forEach((node, i) => {
    const a = dept.angle - fan/2 + (n === 1 ? fan/2 : fan * i/(n-1));
    const jitter = (i % 2 ? 55 : -20);
    const lx = hx + Math.cos(rad(a)) * (R_LEAF + jitter);
    const ly = hy + Math.sin(rad(a)) * (R_LEAF + jitter);
    treeWires.push({ x1:hx, y1:hy, x2:lx, y2:ly });

    const leaf = el('div', 'leaf t-' + node.type + (Math.cos(rad(a)) < -0.15 ? ' ll' : ''), { left:lx+'px', top:ly+'px' });
    leaf.innerHTML = `<span class="lbl">${node.title}</span>`;
    leaf.onclick = ev => { ev.stopPropagation(); openPanel(node.slug); };
    world.appendChild(leaf);

    nodeBySlug[node.slug] = node; posBySlug[node.slug] = { x:lx, y:ly };
    leafBySlug[node.slug] = leaf; deptBySlug[node.slug] = dept;
  });
});

/* wires */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('class', 'wires');
treeWires.forEach(w => {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1',w.x1); l.setAttribute('y1',w.y1); l.setAttribute('x2',w.x2); l.setAttribute('y2',w.y2);
  l.setAttribute('class', w.spine ? 'spine' : 'tree');
  svg.appendChild(l);
});
/* 노드 간 연계선 — 중복 제거 후 곡선으로 */
const relPaths = {}; // key "a|b" -> path
Object.values(nodeBySlug).forEach(node => (node.rel||[]).forEach(r => {
  if (!posBySlug[r]) return;
  const key = [node.slug, r].sort().join('|');
  if (relPaths[key]) return;
  const p1 = posBySlug[node.slug], p2 = posBySlug[r];
  const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
  const d = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  const cx = mx - mx*0.28 * Math.min(1, d/700), cy = my - my*0.28 * Math.min(1, d/700); // 중심 쪽으로 휘는 곡선
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`);
  path.setAttribute('class', 'rel');
  svg.appendChild(path);
  relPaths[key] = path;
}));
world.insertBefore(svg, world.firstChild);

/* stars */
const stars = document.getElementById('stars');
for (let i = 0; i < 140; i++) {
  const s = el('div','star',{ left:Math.random()*100+'%', top:Math.random()*100+'%' });
  const sz = Math.random()*2+0.5; s.style.width = s.style.height = sz+'px';
  s.style.opacity = Math.random()*.25+.05;
  stars.appendChild(s);
}

/* ═══ 팬·줌 ═══ */
let vx = 0, vy = 20, scale = 0.62;
function apply() { world.style.transform = `translate(${vx}px,${vy}px) scale(${scale})`; }
apply();
const stage = document.getElementById('stage');
let drag = null;
stage.addEventListener('mousedown', e => { drag = { x:e.clientX-vx, y:e.clientY-vy }; stage.classList.add('dragging'); world.classList.add('no-anim'); });
window.addEventListener('mousemove', e => { if (!drag) return; vx = e.clientX-drag.x; vy = e.clientY-drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); world.classList.remove('no-anim'); });
stage.addEventListener('wheel', e => {
  e.preventDefault(); world.classList.add('no-anim');
  const k = e.deltaY < 0 ? 1.08 : 0.93;
  const nx = Math.min(1.8, Math.max(0.4, scale * k));
  const cx = e.clientX - innerWidth/2, cy = e.clientY - innerHeight/2;
  vx = cx - (cx - vx) * (nx/scale); vy = cy - (cy - vy) * (nx/scale);
  scale = nx; apply();
  clearTimeout(stage._wt); stage._wt = setTimeout(() => world.classList.remove('no-anim'), 100);
}, { passive:false });

/* ═══ 상세 패널 + 연계 하이라이트 ═══ */
const panel = document.getElementById('panel');
let activeSlug = null;
function setRelHighlight(slug, on) {
  const node = nodeBySlug[slug];
  (node.rel||[]).forEach(r => {
    const p = relPaths[[slug,r].sort().join('|')];
    if (p) p.classList.toggle('on', on);
    if (leafBySlug[r]) leafBySlug[r].classList.toggle('related', on);
  });
}
function openPanel(slug, pan) {
  if (activeSlug) { leafBySlug[activeSlug].classList.remove('active'); setRelHighlight(activeSlug, false); }
  activeSlug = slug;
  const node = nodeBySlug[slug], dept = deptBySlug[slug], leaf = leafBySlug[slug];
  leaf.classList.add('active');
  setRelHighlight(slug, true);
  document.getElementById('p-type').textContent = TYPE_LABEL[node.type];
  document.getElementById('p-title').textContent = node.title;
  document.getElementById('p-crumb').textContent = 'caselab · ' + dept.label;
  document.getElementById('p-pain').textContent = '"' + node.pain + '" — 이 아픔에서 시작합니다.';
  document.getElementById('p-excerpt').textContent = node.excerpt;
  document.getElementById('p-cta').href = SITE + '/' + TYPE_PATH[node.type] + '/' + encodeURIComponent(node.slug);
  const rels = (node.rel||[]).filter(r => nodeBySlug[r]);
  const wrap = document.getElementById('p-rels'), chips = document.getElementById('p-rel-chips');
  wrap.style.display = rels.length ? '' : 'none';
  chips.innerHTML = '';
  rels.forEach(r => {
    const c = el('span','rel-chip'); c.textContent = nodeBySlug[r].title;
    c.onclick = () => openPanel(r, true);
    chips.appendChild(c);
  });
  panel.classList.add('open');
  if (pan) { const p = posBySlug[slug]; vx = -p.x*scale + 120; vy = -p.y*scale; apply(); }
}
function closePanel() {
  panel.classList.remove('open');
  if (activeSlug) { leafBySlug[activeSlug].classList.remove('active'); setRelHighlight(activeSlug, false); activeSlug = null; }
}
stage.addEventListener('click', e => { if (e.target === stage || e.target.id === 'world') closePanel(); });

/* ═══ 검색 ═══ */
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  Object.entries(leafBySlug).forEach(([slug, l]) => {
    const hit = !q || l.textContent.toLowerCase().includes(q);
    l.classList.toggle('dim', !hit);
  });
});
</script>
