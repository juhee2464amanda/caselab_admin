<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* [오버레이] 실영상 위 자막 — 하단 스크림 + 헤드라인 와이프 리빌 + 스와이프 유도 화살표.
   쓰는 법: 텍스트만 교체 후 video 모드에 --overlay 로 전달. 배경은 반드시 투명 유지 */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:transparent; font-family:'Pretendard',sans-serif; }
.scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.66) 100%); }
.kicker { position:absolute; left:72px; top:96px; font-size:30px; font-weight:800; letter-spacing:0.14em; color:var(--accent-bright);
          text-shadow:0 2px 12px rgba(0,0,0,0.6); animation: rise 0.8s ease-out 0.2s both; }
.h { position:absolute; left:72px; right:72px; bottom:200px; font-size:76px; font-weight:800; line-height:1.24; letter-spacing:-0.02em; color:#fff;
     text-shadow:0 2px 16px rgba(0,0,0,0.5); clip-path: inset(0 100% 0 0); animation: wipe 1.1s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
.h b { color:var(--accent-bright); }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.sub { position:absolute; left:72px; right:72px; bottom:130px; font-size:34px; line-height:1.45; color:rgba(255,255,255,0.92);
       text-shadow:0 2px 10px rgba(0,0,0,0.5); animation: rise 0.9s ease-out 1.3s both; }
.swipe { position:absolute; right:72px; bottom:64px; font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.6);
         animation: nudge 1.1s ease-in-out 2s infinite; }
@keyframes nudge { 0%, 100% { transform:translateX(0); opacity:0.85; } 50% { transform:translateX(14px); opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>
<div class="scrim"></div>
<div class="kicker">CASELAB</div>
<div class="h">에이전트 4개가<br><b>동시에</b> 일하는 중</div>
<div class="sub">터미널 하나에서 전부 보인다</div>
<div class="swipe">밀어서 계속 ›››</div>
</body></html>
