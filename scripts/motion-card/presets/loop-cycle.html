<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* 루프 다이어그램 — 골드 점이 원 궤도를 3초에 한 바퀴 돌며 4개 스텝 노드를 순차 점등. '돌아온다' 개념 카드용.
   쓰는 법: 노드 4개 텍스트·중앙 배지 숫자·타이틀·캡션만 바꿔서 html 모드로 렌더 (점등 순서는 delay가 12시→3시→6시→9시로 고정) */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:#FFFFFF; font-family:'Pretendard',sans-serif; color:#14161C; }

.title { position:absolute; left:0; top:170px; width:1080px; text-align:center; font-size:56px; font-weight:800; letter-spacing:-0.02em; }
.title em { font-style:normal; color:var(--accent); }

/* 궤도: 지름 620px 점선 원, 중심 (540, 710) */
.orbit { position:absolute; left:230px; top:400px; width:620px; height:620px; border:3px dashed #B9BEC8; border-radius:50%; }

/* 궤도 점: 부모가 중심에서 회전(공전), 자식 점은 반지름만큼 위로 오프셋 */
.arm { position:absolute; left:540px; top:710px; width:0; height:0; animation: revolve 3s linear infinite; }
@keyframes revolve { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.dot { position:absolute; left:-14px; top:-324px; width:28px; height:28px; border-radius:50%;
       background:var(--accent); box-shadow:0 0 22px 6px rgba(201,162,75,0.55); }

/* 스텝 노드: 12시·3시·6시·9시. 같은 3s 주기, 위상만 0.75s씩 어긋난 음수 delay로 순차 점등 */
.node { position:absolute; width:230px; padding:26px 12px; text-align:center; background:#FFFFFF; border-radius:22px;
        border:3px solid #E5E7EB; box-shadow:0 6px 18px rgba(43,38,32,0.08);
        font-size:26px; font-weight:800; line-height:1.3;
        animation: light 3s linear infinite; }
.node .step { display:block; font-size:20px; font-weight:400; color:#7A828F; margin-bottom:6px; letter-spacing:0.1em; }
@keyframes light {
  0%       { transform:translate(-50%,-50%) scale(1);    border-color:#E5E7EB;    box-shadow:0 6px 18px rgba(43,38,32,0.08); }
  4%       { transform:translate(-50%,-50%) scale(1.08); border-color:var(--accent); box-shadow:0 0 34px 8px rgba(201,162,75,0.4); }
  14%      { transform:translate(-50%,-50%) scale(1.08); border-color:var(--accent); box-shadow:0 0 34px 8px rgba(201,162,75,0.4); }
  30%,100% { transform:translate(-50%,-50%) scale(1);    border-color:#E5E7EB;    box-shadow:0 6px 18px rgba(43,38,32,0.08); }
}
.n1 { left:540px; top:400px;  animation-delay:-3s; }     /* 12시 */
.n2 { left:850px; top:710px;  animation-delay:-2.25s; }  /* 3시 */
.n3 { left:540px; top:1020px; animation-delay:-1.5s; }   /* 6시 */
.n4 { left:230px; top:710px;  animation-delay:-0.75s; }  /* 9시 */

/* 중앙 배지: 궤도 1바퀴(3s)마다 살짝 pulse */
.badge { position:absolute; left:430px; top:600px; width:220px; height:220px; border-radius:50%;
         background:#FFFFFF; border:5px solid var(--accent); box-shadow:0 8px 26px rgba(201,162,75,0.25);
         display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
         animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform:scale(1); } 8% { transform:scale(1.06); } 20% { transform:scale(1); } }
.badge .small { font-size:21px; color:#3A3F4A; line-height:1.3; }
.badge .big { font-size:88px; font-weight:800; color:var(--accent); line-height:1.05; }
.badge .tail { font-size:23px; font-weight:800; }

/* 하단 캡션: 0.8초에 rise-in 후 고정 */
.caption { position:absolute; left:0; top:1160px; width:1080px; text-align:center; font-size:32px; color:#3A3F4A;
           animation: rise 0.9s ease-out 0.8s both; }
.caption strong { color:var(--accent); font-weight:800; }
.quote { position:absolute; left:0; top:1224px; width:1080px; text-align:center; font-size:24px; color:#7A828F;
         animation: rise 0.9s ease-out 1.1s both; }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>

<div class="title">한 번 지시하면, <em>30초마다</em> 돌아온다</div>

<div class="orbit"></div>
<div class="arm"><div class="dot"></div></div>

<div class="node n1"><span class="step">STEP 1</span>폰으로 확인</div>
<div class="node n2"><span class="step">STEP 2</span>한 줄 지시</div>
<div class="node n3"><span class="step">STEP 3</span>약 30초</div>
<div class="node n4"><span class="step">STEP 4</span>반영 확인</div>

<div class="badge">
  <div class="small">이 지시 하나로</div>
  <div class="big">7</div>
  <div class="tail">커밋 완성</div>
</div>

<div class="caption">한 번 지시, <strong>30초마다</strong> 확인</div>
<div class="quote">“화면이 2배로 커져 오른쪽이 잘려 → 둘 다 고치고 커밋·푸시해줘”</div>

</body></html>
