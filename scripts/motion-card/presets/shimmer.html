<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* 골드 시머 — 핵심 단어에 빛이 한 번 훑고 지나간다. 커버 카드용.
   쓰는 법: 텍스트만 교체. 시머 대상은 .shine 스팬 */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:#12151F; font-family:'Pretendard',sans-serif; color:#D6DEE8; }
.kicker { position:absolute; left:96px; top:380px; font-size:32px; font-weight:800; letter-spacing:0.16em; color:#7A828F;
          animation: rise 0.8s ease-out 0.2s both; }
.h { position:absolute; left:96px; right:96px; top:460px; font-size:104px; font-weight:800; line-height:1.24; letter-spacing:-0.02em;
     animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.4s both; }
.shine { background: linear-gradient(110deg, var(--accent) 0%, var(--accent) 40%, var(--accent-bright) 50%, var(--accent) 60%, var(--accent) 100%);
         background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
         animation: sweep 1.6s ease-in-out 1.3s both; }
@keyframes sweep { from { background-position: 120% 0; } to { background-position: -60% 0; } }
.sub { position:absolute; left:96px; right:96px; top:900px; font-size:38px; line-height:1.6; color:#7A828F;
       animation: rise 0.9s ease-out 1.0s both; }
@keyframes rise { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>
<div class="kicker">CASELAB</div>
<div class="h">일 시키는 방법이<br><span class="shine">연봉</span>을 가른다</div>
<div class="sub">같은 AI를 쓰는데 결과가 다른 이유.<br>순서 하나 바꿨을 뿐이다.</div>
</body></html>
