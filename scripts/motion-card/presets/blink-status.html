<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* 상태 깜빡임 — 멀모터미널 콕핏처럼 셀 상태색이 살아 움직인다. 도구 화면 재현용.
   쓰는 법: 셀 이름·상태(working/done/blocked)만 바꾼다 */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:#12151F; font-family:'Pretendard',sans-serif; color:#D6DEE8; }
.title { position:absolute; left:96px; top:220px; font-size:64px; font-weight:800; line-height:1.3; }
.title b { color:var(--accent); }
.grid { position:absolute; left:96px; right:96px; top:460px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
.cell { border-radius:20px; padding:36px 32px; background:#1A2030; border:1px solid #2A3244; }
.cell h3 { font-size:30px; font-weight:800; margin-bottom:14px; }
.cell p { font-size:24px; color:#7A828F; line-height:1.5; }
.st { display:inline-flex; align-items:center; gap:10px; font-size:22px; margin-top:22px; }
.st i { width:14px; height:14px; border-radius:50%; }
.working i { background:#FEBC2E; box-shadow:0 0 14px #FEBC2E; animation: pulse 1.1s ease-in-out infinite; }
.working { color:#FEBC2E; }
.done i { background:#28C840; } .done { color:#28C840; }
.blocked i { background:#FF5F57; box-shadow:0 0 14px #FF5F57; animation: pulse 0.55s steps(1) infinite; }
.blocked { color:#FF5F57; }
.cell.hot { border-color:#FEBC2E; animation: glow 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.25; } }
@keyframes glow { 0%, 100% { box-shadow:0 0 0 rgba(254,188,46,0); } 50% { box-shadow:0 0 42px rgba(254,188,46,0.35); } }
.caption { position:absolute; left:96px; top:1080px; font-size:34px; line-height:1.55; color:#7A828F; animation: rise 0.9s ease-out 0.8s both; }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>
<div class="title">에이전트 4개가<br><b>동시에</b> 일하는 중</div>
<div class="grid">
  <div class="cell hot"><h3>caselab_admin</h3><p>인사이트 API 연동 작성 중</p><div class="st working"><i></i>WORKING</div></div>
  <div class="cell"><h3>caselab_web</h3><p>배포 완료, 검수 대기</p><div class="st done"><i></i>DONE</div></div>
  <div class="cell"><h3>reels-pipeline</h3><p>자막 싱크 질문 대기</p><div class="st blocked"><i></i>WAITING</div></div>
  <div class="cell"><h3>seed-collector</h3><p>수집 42건 적재 완료</p><div class="st done"><i></i>DONE</div></div>
</div>
<div class="caption">터미널 하나에서 전부 보인다.<br>깜빡이는 놈만 봐주면 된다.</div>
</body></html>
