<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* 터미널 타이핑 — 명령어가 한 글자씩 쳐지고 커서가 깜빡인다. 설치·CLI 콘텐츠용.
   쓰는 법: .cmd 텍스트와 steps()·ch 수를 글자수에 맞춰 바꾼다 */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:#FFFFFF; font-family:'Pretendard',sans-serif; }
.title { position:absolute; left:96px; top:280px; font-size:64px; font-weight:800; color:#14161C; line-height:1.3; }
.win { position:absolute; left:96px; right:96px; top:520px; height:420px; background:#12151F; border-radius:24px;
       box-shadow:0 24px 60px rgba(43,38,32,0.25); padding:76px 48px 48px; }
.dots { position:absolute; top:28px; left:32px; display:flex; gap:12px; }
.dots i { width:18px; height:18px; border-radius:50%; }
.term { font-family:'Menlo',monospace; font-size:30px; line-height:1.9; color:#D6DEE8; }
.cmd { display:inline-block; overflow:hidden; white-space:nowrap; vertical-align:bottom;
       animation: typing 1.8s steps(26) 0.5s both; }
@keyframes typing { from { width:0; } to { width:26ch; } }
.cursor { display:inline-block; width:16px; height:34px; background:var(--accent); vertical-align:middle; margin-left:6px;
          animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 0%, 100% { opacity:1; } 50% { opacity:0; } }
.out { color:#7A828F; animation: appear 0.1s 2.6s both; }
.ok  { color:#7EE787; animation: appear 0.1s 3.2s both; }
@keyframes appear { from { opacity:0; } to { opacity:1; } }
.caption { position:absolute; left:96px; top:1020px; font-size:36px; line-height:1.55; color:#3A3F4A; animation: rise 0.9s ease-out 3.4s both; }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>
<div class="title">설치는 이 한 줄이<br>전부다</div>
<div class="win">
  <div class="dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
  <div class="term">
    <span style="color:var(--accent)">~ %</span> <span class="cmd">npx mulmoterminal@latest</span><span class="cursor"></span><br>
    <span class="out">mulmoterminal@4.10.1</span><br>
    <span class="ok">Ok to proceed? (y) y</span>
  </div>
</div>
<div class="caption">계정도, 설정 파일도 없이<br>터미널에서 바로 시작한다.</div>
</body></html>
