<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent:#2F6BFF; --accent-bright:#D6E2FF; }
/* 실사진 켄번즈 + 취소선 반전 — 사진이 천천히 줌되는 동안 통념이 그어지고 답이 올라온다.
   쓰는 법: .bg img의 src(절대경로 file:// 또는 상대경로)와 텍스트를 교체. html 모드로 렌더 */
@font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../../assets/fonts/Pretendard-Regular.woff') format('woff'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../../assets/fonts/Pretendard-ExtraBold.woff') format('woff'); }
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; background:#12151F; font-family:'Pretendard',sans-serif; }
.bg { position:absolute; inset:0; overflow:hidden; }
.bg img { width:100%; height:100%; object-fit:cover; animation: kb 6s linear both; }
@keyframes kb { from { transform:scale(1.0); } to { transform:scale(1.12); } }
.scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.55) 100%); }
.wrap { position:absolute; left:72px; right:72px; bottom:280px; color:#fff; }
.myth { position:relative; display:inline-block; font-size:70px; font-weight:800; line-height:1.3;
        text-shadow:0 2px 14px rgba(0,0,0,0.5); animation: rise 0.8s ease-out 0.4s both; }
.myth::after { content:''; position:absolute; left:-6px; right:-6px; top:54%; height:9px; border-radius:5px; background:var(--accent);
               transform-origin:left center; transform:scaleX(0); animation: strike 0.55s cubic-bezier(0.7,0,0.3,1) 1.6s both; }
@keyframes strike { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.truth { margin-top:30px; font-size:82px; font-weight:800; line-height:1.26; color:var(--accent-bright);
         text-shadow:0 2px 16px rgba(0,0,0,0.55); animation: pop 0.8s cubic-bezier(0.16,1,0.3,1) 2.4s both; }
@keyframes pop { from { opacity:0; transform:translateY(36px); } to { opacity:1; transform:translateY(0); } }
.sub { position:absolute; left:72px; right:72px; bottom:150px; font-size:34px; line-height:1.5; color:rgba(255,255,255,0.9);
       text-shadow:0 2px 10px rgba(0,0,0,0.5); animation: rise 0.9s ease-out 3.1s both; }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
</style></head><body>
<div class="bg"><img src="file:///private/tmp/claude-501/-Users-amanda-Documents-01-side-project-02--caselab-apps-caselab-admin/bcc84fdf-4e71-400b-94e7-3f39cf099220/scratchpad/sample.jpg"></div>
<div class="scrim"></div>
<div class="wrap">
  <div><span class="myth">정답 프롬프트를 찾는다?</span></div>
  <div class="truth">컨텍스트 설계가<br>답이다</div>
</div>
<div class="sub">다 넣지 않는다 — 검색·점진 공개로 모델이 읽게 한다</div>
</body></html>
